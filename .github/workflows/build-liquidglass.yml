# IOS26 云端构建工作流 v4
# 直接从仓库 ios26-patch/ 目录应用 IOS26 原创源码（不再依赖 Release zip）
name: Build IOS26 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android cmdline-tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "platforms;android-36" "build-tools;35.0.0" 2>&1 | tail -5

      - name: Clone AndroidLiquidGlass source
        run: |
          git clone --depth 1 --branch 2.0.1 https://github.com/Kyant0/AndroidLiquidGlass.git liquidglass || \
          git clone --depth 1 https://github.com/Kyant0/AndroidLiquidGlass.git liquidglass

      - name: Apply IOS26 source from repo patch dir
        run: |
          echo "=== 仓库 ios26-patch 结构 ==="
          ls -la ios26-patch/
          echo "=== 复制 commonMain ==="
          cp -r ios26-patch/app/src/commonMain/* liquidglass/app/src/commonMain/
          echo "=== 复制 androidMain ==="
          cp -r ios26-patch/app/src/androidMain/* liquidglass/app/src/androidMain/
          echo "=== 复制 skikoMain ==="
          cp -r ios26-patch/app/src/skikoMain/* liquidglass/app/src/skikoMain/ 2>/dev/null || true
          echo "=== 复制 desktopMain ==="
          cp -r ios26-patch/app/src/desktopMain/* liquidglass/app/src/desktopMain/ 2>/dev/null || true
          echo "=== 复制 iosMain ==="
          cp -r ios26-patch/app/src/iosMain/* liquidglass/app/src/iosMain/ 2>/dev/null || true
          echo "=== 应用 IOS26 应用名 ==="
          cp ios26-patch/androidApp/src/main/res/values/strings.xml liquidglass/androidApp/src/main/res/values/strings.xml
          cat liquidglass/androidApp/src/main/res/values/strings.xml
          echo "=== 验证 IOS26 源码 ==="
          find liquidglass/app/src -name "Ios26*.kt" -o -name "GlassShowcaseScaffold.kt" | sort
          grep -rl "IOS26" liquidglass/app/src/commonMain/kotlin/com/kyant/backdrop/catalog/ | head -5

      - name: Grant gradlew permission
        run: chmod +x liquidglass/gradlew

      - name: Build APK (Debug)
        working-directory: liquidglass
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon 2>&1 | tail -50

      - name: Build APK (Release)
        working-directory: liquidglass
        if: always()
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon 2>&1 | tail -20 || true

      - name: Locate APK outputs
        run: |
          echo "=== IOS26 APK 产物 ==="
          find liquidglass -type f -name "*.apk" | tee /tmp/apk_list.txt
          ls -la liquidglass/androidApp/build/outputs/apk/ 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios26-apks
          path: |
            liquidglass/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Rename APKs to IOS26
        working-directory: liquidglass
        if: always()
        run: |
          if [ -f androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk IOS26-debug.apk
          fi
          if [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk IOS26-release.apk
          fi
          ls -la IOS26*.apk 2>/dev/null || true

      - name: Upload IOS26 APK to release
        if: always()
        run: |
          VERSION="ios26-1.0"
          gh release delete $VERSION --yes 2>/dev/null || true
          gh release create $VERSION --title "IOS26 Liquid Glass Gallery" --notes "原创 IOS26 液态玻璃组件展示应用 · 基于 AndroidLiquidGlass 引擎构建" || true
          for apk in $(find liquidglass -type f -name "*.apk"); do
            echo "上传: $(basename $apk)"
            gh release upload $VERSION "$apk" --clobber || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "## IOS26 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "APK 已上传到 Release: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY