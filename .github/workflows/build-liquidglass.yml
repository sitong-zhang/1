# IOS26 云端构建工作流 v5
# 从仓库 ios26-patch/ 应用源码 + 云端修复编译错误
name: Build IOS26 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android cmdline-tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "platforms;android-36" "build-tools;35.0.0" 2>&1 | tail -5

      - name: Clone AndroidLiquidGlass source
        run: |
          git clone --depth 1 --branch 2.0.1 https://github.com/Kyant0/AndroidLiquidGlass.git liquidglass || \
          git clone --depth 1 https://github.com/Kyant0/AndroidLiquidGlass.git liquidglass

      - name: Apply IOS26 source from repo patch dir
        run: |
          cp -r ios26-patch/app/src/commonMain/* liquidglass/app/src/commonMain/
          cp -r ios26-patch/app/src/androidMain/* liquidglass/app/src/androidMain/
          cp -r ios26-patch/app/src/skikoMain/* liquidglass/app/src/skikoMain/ 2>/dev/null || true
          cp -r ios26-patch/app/src/desktopMain/* liquidglass/app/src/desktopMain/ 2>/dev/null || true
          cp -r ios26-patch/app/src/iosMain/* liquidglass/app/src/iosMain/ 2>/dev/null || true
          cp ios26-patch/androidApp/src/main/res/values/strings.xml liquidglass/androidApp/src/main/res/values/strings.xml
          echo "=== 验证 ==="
          find liquidglass/app/src -name "Ios26*.kt" -o -name "GlassShowcaseScaffold.kt" | sort

      - name: Fix compilation errors in IOS26 source
        working-directory: liquidglass
        run: |
          echo "=== 修复1: Ios26Slider toPx ==="
          cat > /tmp/slider_fix.py << 'EOF'
import re
path = 'app/src/commonMain/kotlin/com/kyant/backdrop/catalog/components/Ios26Slider.kt'
s = open(path).read()
# 在 composable 内使用 LocalDensity
s = s.replace(
    'import androidx.compose.ui.input.pointer.pointerInput',
    'import androidx.compose.ui.input.pointer.pointerInput\nimport androidx.compose.ui.platform.LocalDensity'
)
s = s.replace(
    'val thumbSizePx = 26f.dp.toPx()',
    'val density = LocalDensity.current\n        val thumbSizePx = with(density) { 26f.dp.toPx() }'
)
open(path, 'w').write(s)
print('slider fixed')
EOF
          python3 /tmp/slider_fix.py

          echo "=== 修复2: CardsContent typo ==="
          python3 - << 'EOF'
path = 'app/src/commonMain/kotlin/com/kyant/backdrop/catalog/destinations/CardsContent.kt'
s = open(path).read()
s = s.replace('drawCircle(Color(0xFFFF2D55), radius = size.minDimension / 2)', 'drawCircle(Color(0xFFFF2D55), radius = size.minDimension / 2f)')
open(path, 'w').write(s)
print('cards fixed')
EOF

          echo "=== 修复3: ControlCenter weight ==="
          python3 - << 'EOF'
path = 'app/src/commonMain/kotlin/com/kyant/backdrop/catalog/destinations/ControlCenterContent.kt'
s = open(path).read()
# ToggleTile 的 weight 需要 ColumnScope receiver
s = s.replace('@Composable\nprivate fun ToggleTile(', '@Composable\nprivate fun androidx.compose.foundation.layout.ColumnScope.ToggleTile(')
open(path, 'w').write(s)
print('control center fixed')
EOF

          echo "=== 修复4: HomeContent padding ==="
          python3 - << 'EOF'
path = 'app/src/commonMain/kotlin/com/kyant/backdrop/catalog/destinations/HomeContent.kt'
s = open(path).read()
s = s.replace('import com.kyant.backdrop.catalog.CatalogDestion', 'import com.kyant.backdrop.catalog.CatalogDestination')
s = s.replace('CatalogDestion', 'CatalogDestination')
open(path, 'w').write(s)
print('home fixed')
EOF

          echo "=== 修复5: Playground composable ==="
          python3 - << 'EOF'
path = 'app/src/commonMain/kotlin/com/kyant/backdrop/catalog/destinations/PlaygroundContent.kt'
s = open(path).read()
s = s.replace('@composable', '@Composable')
open(path, 'w').write(s)
print('playground fixed')
EOF

          echo "=== 编译前语法检查 ==="
          grep -n "CatalogDestion" app/src/commonMain/kotlin/com/kyant/backdrop/catalog/destinations/HomeContent.kt || echo "home OK"
          grep -n "@composable" app/src/commonMain/kotlin/com/kyant/backdrop/catalog/destinations/PlaygroundContent.kt || echo "playground OK"

      - name: Grant gradlew permission
        run: chmod +x liquidglass/gradlew

      - name: Build APK (Debug)
        working-directory: liquidglass
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon 2>&1 | tail -50

      - name: Build APK (Release)
        working-directory: liquidglass
        if: always()
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon 2>&1 | tail -20 || true

      - name: Locate APK outputs
        run: |
          echo "=== IOS26 APK 产物 ==="
          find liquidglass -type f -name "*.apk" | tee /tmp/apk_list.txt
          ls -la liquidglass/androidApp/build/outputs/apk/ 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios26-apks
          path: |
            liquidglass/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Rename APKs to IOS26
        working-directory: liquidglass
        if: always()
        run: |
          if [ -f androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk IOS26-debug.apk
          fi
          if [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk IOS26-release.apk
          fi
          ls -la IOS26*.apk 2>/dev/null || true

      - name: Upload IOS26 APK to release
        if: always()
        run: |
          VERSION="ios26-1.0"
          gh release delete $VERSION --yes 2>/dev/null || true
          gh release create $VERSION --title "IOS26 Liquid Glass Gallery" --notes "原创 IOS26 液态玻璃组件展示应用 · 基于 AndroidLiquidGlass 引擎构建" || true
          for apk in $(find liquidglass -type f -name "*.apk"); do
            echo "上传: $(basename $apk)"
            gh release upload $VERSION "$apk" --clobber || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "## IOS26 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "APK 已上传到 Release: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY