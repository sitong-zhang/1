# Liquid Glass APK 云端构建工作流 v2
name: Build Liquid Glass APK

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android cmdline-tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest 2>/dev/null || true
          ls -la $HOME/android-sdk/cmdline-tools/latest/bin/
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "platforms;android-36" "build-tools;35.0.0" "platforms;android-35" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Clone AndroidLiquidGlass source
        run: |
          git clone --depth 1 --branch 2.0.1 https://github.com/Kyant0/AndroidLiquidGlass.git liquidglass || \
          git clone --depth 1 https://github.com/Kyant0/AndroidLiquidGlass.git liquidglass
          ls -la liquidglass/

      - name: Grant gradlew permission
        run: chmod +x liquidglass/gradlew

      - name: Build APK (Debug)
        working-directory: liquidglass
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Build APK (Release)
        working-directory: liquidglass
        if: always()
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon 2>&1 | tail -20 || true

      - name: Locate APK outputs
        run: |
          echo "=== APK 产物 ==="
          find liquidglass -type f -name "*.apk" | tee /tmp/apk_list.txt
          ls -la liquidglass/androidApp/build/outputs/apk/ 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquidglass-apks
          path: |
            liquidglass/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload APK to release
        if: always()
        run: |
          VERSION="2.0.1"
          gh release delete v$VERSION --yes 2>/dev/null || true
          gh release create v$VERSION --title "AndroidLiquidGlass $VERSION" --notes "Auto-built APK" || true
          for apk in $(find liquidglass -type f -name "*.apk"); do
            echo "上传: $apk"
            gh release upload v$VERSION "$apk" --clobber || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "## 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "APK 已上传到 Releases: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY